# =========================
#  Kitty - NixOS Blue Theme
# =========================
confirm_os_window_close 0

# Font (change if you want)
font_family      JetBrainsMono Nerd Font
font_size        10

# Cursor
cursor_shape     block
cursor_blink_interval 0

# Window
background_opacity 0.60
dynamic_background_opacity yes
window_padding_width 10
hide_window_decorations yes

# =========================
# COLORS
# =========================

# Background / Foreground
background #0b0f14
foreground #cdd6f4

# Primary blue accent (your color)
color1  #89b4fa   # main blue
color4  #89b4fa   # links / highlights
color12 #89b4fa   # bright blue

# Soft grays (UI structure)
color0  #1a1f2a
color8  #313846

color7  #cdd6f4
color15 #e6edf3

# Accents
color2  #a6e3a1
color3  #f9e2af
color5  #cba6f7
color6  #94e2d5
color9  #f38ba8

# Selection
selection_background #89b4fa
selection_foreground #0b0f14

# Cursor color
cursor #89b4fa

# URL styling
url_color #89b4fa

# =========================
# PERFORMANCE / FEEL
# =========================

repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell off (clean experience)
enable_audio_bell no
visual_bell_duration 0.0


