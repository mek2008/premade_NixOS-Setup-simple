###sys31tem###
env = XCURSOR_SIZE,18
env = QT_QPA_PLATFORM,wayland
#env = WLR_NO_HARDWARE_CURSORS,1
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = XCURSOR_THEME,Bibata-Modern-Ice
env = __GL_YIELD,USLEEP
env = __GL_GSYNC_ALLOWED=1
env = __GL_VRR_ALLOWED=1

autogenerated = 0

###monitors###


workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1

workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1

###programs###
$terminal = kitty
$fileManager = thunar
$menu = wofi

###autostart###
exec-once = hyprctl dispatch movecursor 2900 900
exec-once = waybar
exec-once = nm-applet
exec-once = blueman-applet
#exec-once = hyprpaper
#exec-once = kitty
exec-once = awww init
exec-once = awww-daemon
exec-once = sleep 5 && awww img /home/mk/Pictures/wallpapers/walltwo.png --transition-type wipe --transition-duration 2
#exec-once = sh -c "awww init; sleep 2; awww img /home/mk/Pictures/wallpapers/walltwo.png --transition-type wipe --transition-duration 2"
#exec-once = sleep 0.1 && hyprctl dispatch movecursor 1 0 && hyprctl dispatch movecursor -1 0
###look###


exec-once = kitty --hold fastfetch

general{
  gaps_in = 3
  gaps_out = 6

  border_size = 2

  col.active_border = rgba(89b4faff)
  col.inactive_border = rgba(ccccccaa)

  resize_on_border = true
  layout = dwindle
}

decoration{
  rounding = 7

  blur{
    enabled = true
    size = 5
    passes = 3
  }

  shadow{
    enabled = true
    range = 15
  }
}


animations{
  enabled = true
   
  bezier = myBezier,0.05,0.9,0.1,1.05

  animation = windows,1,4,myBezier 
  animation = windowsOut,1,4,default,popin 80%
  animation = border,1,5,default
  animation = fade,1,4,default
  animation = workspaces,1,3,default
}

dwindle {
  preserve_split = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
#remove if annoying
  focus_on_activate = true
  vrr = 0
#   hide_cursor = ture
}


###keybinds###

input {
  sensitivity = -0.6
}
cursor {
#    no_hardware_cursors = true;
    hide_on_key_press = true;
    inactive_timeout = 5;
#    invisible = true
}

$mainMod = SUPER
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, M, exit
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu --show drun
bind = $mainMod, f, exec, $menu --show run
bind = $mainMod, B, exec, firefox 
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
#bind = $mainMod, J, togglesplit

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8


bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

bind = SUPER SHIFT, left,  movewindow, l, 10
bind = SUPER SHIFT, right, movewindow, r, 10
bind = SUPER SHIFT, up,    movewindow, u, 10
bind = SUPER SHIFT, down,  movewindow, d, 10




# ───────────────── AUDIO ─────────────────

bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# ─ mute mic ─
bind = , F5, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ─ bluetooth toggle ─
bind = , F6, exec, bluetoothctl power toggle

# ───────────────── BRIGHTNESS ─────────────────

bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10-%-
